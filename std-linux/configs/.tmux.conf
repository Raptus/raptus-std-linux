# --- tmux.conf ---
# GeE | Raptus AG
# Screen-kompatible Keybindings + eigene Statusbar

# === PREFIX: C-a statt C-b (wie Screen) ===
set -g prefix C-a
unbind C-b
bind a send-prefix
bind C-a last-window

# === Grundverhalten ===
set -g visual-bell on
set -g visual-activity on
set -g bell-action any
set -g display-time 2000
set -g mouse on
set -g focus-events on
set -sg escape-time 1
set -g set-titles on
set -g set-titles-string '#T'
set-environment -g COLORTERM truecolor

# === Terminal & Farben ===
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

# === Clipboard (macOS) ===
set -g set-clipboard on
set -s copy-command "pbcopy"

# === Scrollback ===
set -g history-limit 300000

# === Nummerierung ===
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# === Statusbar (beibehalten) ===
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=blue,fg=white"
set -g status-left " #[bold]%a %Y-%m-%d %H:%M#[nobold] | "
set -g status-left-length 30
set -g status-right " #[bold]#H#[nobold] | #(sysctl -n vm.loadavg 2>/dev/null | tr -d '{}' || uptime | sed 's/.*load average[s]*:/load:/') "
set -g status-right-length 60
set -g window-status-current-style "bg=white,fg=blue,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# === Vi-Mode ===
setw -g mode-keys vi
set -ag message-style "fg=black,bg=brightwhite"

# === Screen-kompatible Keybindings ===
# Navigation
bind n next-window
bind C-n next-window
bind p previous-window
bind C-p previous-window

# Fenster erstellen/schliessen
bind c new-window -c "#{pane_current_path}"
bind C-c new-window
unbind t
bind t new-window
bind C-t new-window
bind k kill-window
bind C-k kill-window
bind \\ kill-session

# Detach
bind C-d detach-client

# Fensterliste (wie Screen C-a w)
bind w display-message "#{W:#{E:window-status-format} ,#{E:window-status-current-format} }"
bind C-w display-message "#{W:#{E:window-status-format} ,#{E:window-status-current-format} }"

# === Scrolling & Copy-Mode ===
bind Escape copy-mode
bind -n S-Pageup copy-mode -u
bind -T copy-mode-vi S-Pageup send-keys -X page-up
bind -T copy-mode-vi S-Pagedown send-keys -X page-down

# === Pane Splitting (tmux Bonus) ===
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# === Reload ===
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# eof
