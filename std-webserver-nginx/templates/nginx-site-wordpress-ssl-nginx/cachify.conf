
        open_file_cache         off;

        if ( $query_string ) {
            return 405;
        }
        if ( $request_method = POST ) {
            return 405;
        }
        if ( $request_uri ~ /wp-admin/ ) {
            return 405;
        }
        if ( $http_cookie ~ (wp-postpass|wordpress_logged_in|comment_author)_ ) {
            return 405;
        }

        error_page 404 405 = @nocache;

        try_files /content/cache/cachify/https-${host}${uri}index.html @nocache;
    }

    ## PROTECT CACHE
    location ~ /content/cache {
        internal;
    }

