    # Caching headers and on demand thumbnail generation for images (except JPEG and PNG) and CSS

        # Media imported from Corvo
        location ~* /content/uploads/imported/.*\.(?!(png|jpe?g))[^\.]*$ {

            # WP Performance Pack Rewrite Rule (on-demand thumbnail generation)
            if (!-e $request_filename) {
                rewrite ^/(.*)-([0-9]+)x([0-9]+)?\.((?i)jpeg|jpg|png|gif) /content/plugins/raptus-image-compression/compatibility/wp-performance-pack/serve-dynamic-images-ut.php;
            }

            log_not_found           off;
            expires                 max; # Imported media files have unique file names and therefor allow max caching
        }

        # Media uploaded through WordPress
        location ~* \.(gif|css|js|ico|xml|svg|woff|woff2|eot|ttf|webp)$ {

            # WP Performance Pack Rewrite Rule (On-demand thumbnail generation)
            if (!-e $request_filename) {
                rewrite ^/(.*)-([0-9]+)x([0-9]+)?\.((?i)jpeg|jpg|png|gif) /content/plugins/raptus-image-compression/compatibility/wp-performance-pack/serve-dynamic-images-ut.php;
            }

            log_not_found           off;
            expires                 1w; # Keep images and CSS in browser cache for as long as possible, to cut down on server load
        }

    # Caching headers and on demand thumbnail and webp generation for JPEG and PNG

        # Media imported from Corvo
        location ~* /content/uploads/imported/.*\.(png|jpe?g)$ {
            log_not_found           off;
            expires                 max; # Imported media files have unique file names and therefor allow max caching
            fastcgi_cache_bypass    1;
            fastcgi_no_cache        1;

            # WP Performance Pack Rewrite Rule (On-demand thumbnail generation)
            if (!-e $request_filename) {
                rewrite ^/(.*)-([0-9]+)x([0-9]+)?\.((?i)jpeg|jpg|png|gif) /content/plugins/raptus-image-compression/compatibility/wp-performance-pack/serve-dynamic-images-ut.php;
            }

            # WebP not supported
            if ($http_accept !~* "webp") {
                break;
            }

            # WebP already exists => redirect
            if (-e $request_filename.webp) {
                return 302 $scheme://$server_name$uri.webp;
            }

            # Generate WebP image
            try_files
               /content/webp-express/webp-images/doc-root/$uri.webp
               $uri.webp
               /content/plugins/webp-express/wod/webp-on-demand.php?xsource=x$request_filename&wp-content=content
                ;
        }

        # Media uploaded through WordPress
        location ~* /content/uploads/.*\.(png|jpe?g)$ {
            log_not_found           off;
            expires                 1w; # Keep images and CSS in browser cache for as long as possible, to cut down on server load
            fastcgi_cache_bypass    1;
            fastcgi_no_cache        1;

            # WP Performance Pack Rewrite Rule (On-demand thumbnail generation)
            if (!-e $request_filename) {
                rewrite ^/(.*)-([0-9]+)x([0-9]+)?\.((?i)jpeg|jpg|png|gif) /content/plugins/raptus-image-compression/compatibility/wp-performance-pack/serve-dynamic-images-ut.php;
            }

            # WebP not supported
            if ($http_accept !~* "webp") {
                break;
            }

            # WebP already exists => redirect
            if (-e $request_filename.webp) {
                return 302 $scheme://$server_name$uri.webp;
            }

            # Generate WebP image
            try_files
                /content/webp-express/webp-images/doc-root/$uri.webp
                $uri.webp
                /content/plugins/webp-express/wod/webp-on-demand.php?xsource=x$request_filename&wp-content=content
                ;
        }

    # Route requests for non-existing webps to the converter
    location ~* /content/uploads/.*\.(png|jpe?g)\.webp$ {
        try_files
            $uri
            /content/plugins/webp-express/wod/webp-realizer.php?xdestination=x$request_filename&wp-content=content
            ;
    }
