    # Media imported from Corvo
    location ~* /uploads/imported/.*$ {

        # WP Performance Pack Rewrite Rule (On-demand thumbnail generation)
        if (!-e $request_filename) {
            rewrite ^/(.*)-([0-9]+)x([0-9]+)?\.((?i)jpeg|jpg|png|gif) /content/plugins/raptus-image-compression/compatibility/wp-performance-pack/serve-dynamic-images-ut.php;
        }

        log_not_found           off;
        expires                 max; # Imported media files have unique file names and therefor allow max caching
    }

    # Media uploaded through WordPress
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|eot|ttf)$ {

        # WP Performance Pack Rewrite Rule (On-demand thumbnail generation)
        if (!-e $request_filename) {
            rewrite ^/(.*)-([0-9]+)x([0-9]+)?\.((?i)jpeg|jpg|png|gif) /content/plugins/raptus-image-compression/compatibility/wp-performance-pack/serve-dynamic-images-ut.php;
        }

        log_not_found           off;
        expires                 1w; # Keep images and resources in browser cache for as long as possible, to cut down on server load
    }
