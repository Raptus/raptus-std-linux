    location ~ ^/web-hooks {
        allow 127.0.0.1;
        deny all;

        try_files $uri $uri/index.php?$args;

        # This will make sure that the fcgi_cache_rebuild hook is run as nginx user
        # to allow deletion of cache files
        location ~ fcgi_cache_rebuild/.*\.php {
            include             fastcgi_params;
            fastcgi_pass        unix:/home/sites/SITE_NAME/run/php-fpm-nginx.sock;
            fastcgi_temp_path   /home/sites/SITE_NAME/pub/tmp/fcgi 1 2;
            fastcgi_param       SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param       HTTPS on;

            add_header          WebHook 1;
        }

        # This will inherit the allow/deny from the outer location
        location ~ \.php$ {
            include             fastcgi_params;
            fastcgi_pass        unix:/home/sites/SITE_NAME/run/php-fpm.sock;
            fastcgi_temp_path   /home/sites/SITE_NAME/pub/tmp/fcgi 1 2;
            fastcgi_param       SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param       HTTPS on;

            add_header          WebHook 1;
        }
    }

